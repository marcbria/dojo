---
# ============================================================================
# BACKUP (rsync) - Create a filesystem snapshot set for a single site.
#
# Alternative to backup-snap.yml for hosts WITHOUT ZFS (typically test/staging
# servers). Instead of ZFS snapshots, it copies the persistent data into a
# timestamped folder:
#
#   /srv/backup/<site>/<timestamp>/
#   ├── definition/
#   │   ├── docker-compose.yml
#   │   ├── docker-compose.override.yml
#   │   └── .env
#   ├── db/
#   ├── config/
#   ├── logs/
#   ├── private/          ← omitted when skip_private=true
#   ├── public/           ← omitted when skip_public=true
#   └── SNAPSHOT.info
#
# Unlike backup-snap.yml (ZFS), this backup DOES include the site definition
# files (docker-compose*.yml, .env). That breaks the strict GitOps principle
# but makes test restores self-contained.
#
# Size/speed control (`skip_files`, `skip_private`, `skip_public`):
#   skip_files=true    → skip both private/ and public/ (biggest folders)
#   skip_private=true  → skip private/ only
#   skip_public=true   → skip public/ only
#   Default: all three are false (full backup).
#
# Consistency levels (`consistency`):
#   none  → no intervention. NOT recommended for rsync (no atomicity).
#   pause → docker pause the app container during the copy
#   stop  → docker compose stop (app + db) during the copy   [default for rsync]
#
# Usage:
#   just dojo-backup-rsync-snap <site> <host>
#   just dojo-backup-rsync-snap <site> <host> skip_files=true
#   just dojo-backup-rsync-snap <site> <host> consistency=pause
#   just dojo-backup-rsync-snap <site> <host> snapshot_tag=pre-upgrade-3_5
# ============================================================================
- name: "BACKUP (rsync) - Create filesystem snapshot for a site"
  hosts: all
  become: yes
  gather_facts: yes
  vars:
    hostName: "{{ host }}"
    siteParam: "{{ site }}"
    backupRoot:  "{{ backup_root  | default('/srv/backup') }}"
    snapshotTag: "{{ snapshot_tag | default(lookup('pipe', 'date -u +%Y%m%d-%H%M%S')) }}"
    snapshotDir: "{{ backupRoot }}/{{ allVars.dojo.id | default(siteParam) }}/{{ snapshotTag }}"
    consistency: "{{ consistency_mode | default('stop') }}"
    skipFiles:   "{{ skip_files   | default(false) | bool }}"
    skipPrivate: "{{ skip_private | default(skipFiles) | bool }}"
    skipPublic:  "{{ skip_public  | default(skipFiles) | bool }}"
  vars_files:
    - ./configs/dojo.yml
    - ./configs/secret.yml
    - ./inventory/sites/base-{{ hostName }}.yml
  tasks:
    - name: "INIT - Load allVars"
      include_tasks: ../setAllVars.yml
      vars: { mode: site, param: "{{ siteParam }}" }

    - name: "INIT - Resolve paths"
      set_fact:
        siteDir:       "{{ allVars.path.base.sites }}/{{ allVars.dojo.id }}"
        dbSource:      "{{ allVars.path.volumes.db }}/{{ allVars.dojo.id }}"
        configSource:  "{{ allVars.path.files.config }}/{{ allVars.dojo.id }}"
        privateSource: "{{ allVars.path.files.private }}/{{ allVars.dojo.id }}"
        publicSource:  "{{ allVars.path.files.public }}/{{ allVars.dojo.id }}"
        logsSource:    "{{ allVars.path.volumes.logs }}/{{ allVars.dojo.id }}"

    - name: "CHECK - Site directory exists"
      stat: { path: "{{ siteDir }}" }
      register: siteDirStat

    - name: "FAIL - Site not found"
      fail: { msg: "Site directory not found: {{ siteDir }}" }
      when: not siteDirStat.stat.exists

    - name: "CHECK - Required definition files exist"
      stat:
        path: "{{ siteDir }}/{{ item }}"
      loop:
        - docker-compose.yml
        - docker-compose.override.yml
        - .env
      register: defFiles

    - name: "FAIL - Missing definition files"
      fail:
        msg: |
          Missing definition file(s) in {{ siteDir }}/:
          {% for r in defFiles.results if not r.stat.exists %}
            - {{ r.item }}
          {% endfor %}

          These are required for rsync backups (they are included in the
          snapshot). Run 'just dojo-create {{ site }} {{ host }}' first.
      when: defFiles.results | selectattr('stat.exists', 'equalto', false) | list | length > 0

    - name: "CHECK - Snapshot directory does not already exist"
      stat: { path: "{{ snapshotDir }}" }
      register: snapshotDirStat

    - name: "FAIL - Snapshot already exists"
      fail:
        msg: "Snapshot directory already exists: {{ snapshotDir }}"
      when: snapshotDirStat.stat.exists

    - name: "CHECK - rsync binary is available"
      command: which rsync
      register: rsyncBin
      changed_when: false
      failed_when: false

    - name: "FAIL - rsync not installed"
      fail: { msg: "rsync is not installed on {{ inventory_hostname }}" }
      when: rsyncBin.rc != 0

    # ---------- Create snapshot skeleton ----------------------------------
    - name: "SNAP - Create snapshot directory structure"
      file:
        path: "{{ snapshotDir }}/{{ item }}"
        state: directory
        mode: "0744"
      loop:
        - definition
        - db
        - config
        - logs
        - private
        - public

    # ---------- Optional consistency --------------------------------------
    - name: "PAUSE - Pause app container (consistency=pause)"
      shell: |
        set -e
        name="{{ allVars.dojo.tool }}_app_{{ allVars.dojo.id }}"
        if docker ps --format '{{ '{{' }}.Names{{ '}}' }}' | grep -qx "$name"; then
          docker pause "$name"
          echo paused
        else
          echo skipped
        fi
      register: pauseResult
      changed_when: "'paused' in pauseResult.stdout"
      when: consistency == 'pause'

    - name: "STOP - Stop app + db containers (consistency=stop)"
      shell: |
        set -e
        cd "{{ siteDir }}"
        if docker compose ps --quiet | grep -q .; then
          docker compose stop
          echo stopped
        else
          echo skipped
        fi
      register: stopResult
      changed_when: "'stopped' in stopResult.stdout"
      when: consistency == 'stop'

    # ---------- Copy data -------------------------------------------------
    - name: "COPY - Site definition files"
      copy:
        src: "{{ siteDir }}/{{ item }}"
        dest: "{{ snapshotDir }}/definition/{{ item }}"
        remote_src: yes
        mode: "0600"
      loop:
        - docker-compose.yml
        - docker-compose.override.yml
        - .env

    - name: "COPY - Database"
      shell: "rsync -aHAX --delete '{{ dbSource }}/' '{{ snapshotDir }}/db/'"
      changed_when: true

    - name: "COPY - Config"
      shell: "rsync -aHAX --delete '{{ configSource }}/' '{{ snapshotDir }}/config/'"
      changed_when: true

    - name: "COPY - Logs"
      shell: "rsync -aHAX --delete '{{ logsSource }}/' '{{ snapshotDir }}/logs/'"
      changed_when: true

    - name: "COPY - Private files"
      shell: "rsync -aHAX --delete '{{ privateSource }}/' '{{ snapshotDir }}/private/'"
      changed_when: true
      when: not skipPrivate

    - name: "COPY - Public files"
      shell: "rsync -aHAX --delete '{{ publicSource }}/' '{{ snapshotDir }}/public/'"
      changed_when: true
      when: not skipPublic

    - name: "CLEANUP - Remove skipped folders"
      file:
        path: "{{ snapshotDir }}/{{ item }}"
        state: absent
      loop:
        - private
        - public
      when: >
        (item == 'private' and skipPrivate) or
        (item == 'public'  and skipPublic)

    # ---------- Metadata --------------------------------------------------
    - name: "SNAP - Write SNAPSHOT.info metadata"
      copy:
        dest: "{{ snapshotDir }}/SNAPSHOT.info"
        mode: "0644"
        content: |
          # dojo rsync snapshot metadata
          site:           {{ allVars.dojo.id }}
          tool:           {{ allVars.dojo.tool }}
          version:        {{ allVars.dojo.version | default('n/a') }}
          host:           {{ inventory_hostname }}
          timestamp:      {{ snapshotTag }}
          created_utc:    {{ ansible_date_time.iso8601 }}
          consistency:    {{ consistency }}
          skip_files:     {{ skipFiles }}
          skip_private:   {{ skipPrivate }}
          skip_public:    {{ skipPublic }}
          backup_root:    {{ backupRoot }}

    # ---------- Restore service -------------------------------------------
    - name: "UNPAUSE - Resume app container"
      shell: |
        set -e
        name="{{ allVars.dojo.tool }}_app_{{ allVars.dojo.id }}"
        if docker ps --format '{{ '{{' }}.Names{{ '}}' }}' | grep -qx "$name"; then
          docker unpause "$name"
        fi
      when: consistency == 'pause'

    - name: "RESUME - Bring app + db up"
      shell:
        cmd: docker compose up -d
        chdir: "{{ siteDir }}"
      when: consistency == 'stop'

    - name: "REPORT - Backup created"
      debug:
        msg:
          - "Site:       {{ allVars.dojo.id }}"
          - "Snapshot:   {{ snapshotTag }}"
          - "Directory:  {{ snapshotDir }}"
          - "Mode:       {{ consistency }}"
          - "skip_files: {{ skipFiles }}  (private={{ skipPrivate }}, public={{ skipPublic }})"
          - "Restore:    just dojo-restore-rsync-snap {{ site }} {{ host }} {{ snapshotTag }} confirm=RESTORE-{{ allVars.dojo.id }}"
