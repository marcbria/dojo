---
# ============================================================================
# RESTORE (rsync) - Restore a site from a filesystem snapshot set.
#
# DESTRUCTIVE: current data is moved to <path>.pre-restore-<timestamp>/ before
# restoring. Verify, then delete the .pre-restore-* folders manually.
#
# This playbook also restores the site definition files (docker-compose*.yml
# and .env) from the snapshot's definition/ folder, since rsync backups
# include them by design. This is a conscious difference from the ZFS version:
# rsync snapshots are self-contained.
#
# If the snapshot has been created with skip_files / skip_private / skip_public,
# those folders are skipped during restore AND left as-is on the live site.
# The move-aside step only touches folders that are going to be overwritten,
# so partial snapshots (e.g. -quick) never wipe out private/ or public/.
#
# Recovery when the site directory is missing:
#   The STOP phase falls back to 'docker stop' by container name if the
#   site directory no longer exists, so a restore from a self-contained
#   rsync snapshot works even after /home/docker/sites/<site>/ is gone.
#   The 'RESTORE - Ensure symlinks' tasks rebuild the symlink tree that
#   normally comes from dojo-create (site-folders.yml), so docker compose
#   can resolve volumes/config/*.cnf, volumes/db, etc.
#
# Usage:
#   just dojo-restore-rsync-snap <site> <host> <timestamp> confirm=RESTORE-<site>
# ============================================================================
- name: "RESTORE (rsync) - Restore a site from a filesystem snapshot"
  hosts: all
  become: yes
  gather_facts: yes
  vars:
    hostName: "{{ host }}"
    siteParam: "{{ site }}"
    backupRoot: "{{ backup_root | default('/srv/backup') }}"
    snapshotTagRaw: "{{ snapshot_tag | default('') }}"
    backupSuffix: "pre-restore-{{ lookup('pipe','date -u +%Y%m%d-%H%M%S') }}"
    confirmToken: "{{ confirm | default('') }}"
  vars_files:
    - ./configs/dojo.yml
    - ./configs/secret.yml
    - ./inventory/sites/base-{{ hostName }}.yml
  tasks:
    - name: "INIT - Load allVars"
      include_tasks: ../setAllVars.yml
      vars: { mode: site, param: "{{ siteParam }}" }

    - name: "INIT - Resolve paths"
      set_fact:
        siteDir:       "{{ allVars.path.base.sites }}/{{ allVars.dojo.id }}"
        snapshotDir:   "{{ backupRoot }}/{{ allVars.dojo.id }}/{{ snapshotTagRaw }}"
        dbTarget:      "{{ allVars.path.volumes.db }}/{{ allVars.dojo.id }}"
        configTarget:  "{{ allVars.path.files.config }}/{{ allVars.dojo.id }}"
        privateTarget: "{{ allVars.path.files.private }}/{{ allVars.dojo.id }}"
        publicTarget:  "{{ allVars.path.files.public }}/{{ allVars.dojo.id }}"
        logsTarget:    "{{ allVars.path.volumes.logs }}/{{ allVars.dojo.id }}"
        volumesAll:    "{{ allVars.path.volumes.all }}/{{ allVars.dojo.id }}"
        dbContainer:   "{{ allVars.dojo.tool }}_db_{{ allVars.dojo.id }}"
        appContainer:  "{{ allVars.dojo.tool }}_app_{{ allVars.dojo.id }}"

    - name: "SAFETY - Require explicit confirmation"
      fail:
        msg: |
          Restore is DESTRUCTIVE.
          Pass:  confirm=RESTORE-{{ allVars.dojo.id }}
          Run:   just dojo-restore-rsync-snap {{ site }} {{ host }} {{ snapshotTagRaw }} confirm=RESTORE-{{ allVars.dojo.id }}
      when: confirmToken != ('RESTORE-' ~ allVars.dojo.id)

    - name: "CHECK - snapshot_tag provided"
      fail: { msg: "snapshot_tag is required" }
      when: snapshotTagRaw | length == 0

    - name: "CHECK - Snapshot directory exists"
      stat: { path: "{{ snapshotDir }}" }
      register: snapStat

    - name: "FAIL - Snapshot not found"
      fail: { msg: "Snapshot not found: {{ snapshotDir }}" }
      when: not snapStat.stat.exists

    - name: "CHECK - Snapshot contains required subfolders"
      stat:
        path: "{{ snapshotDir }}/{{ item }}"
      loop:
        - definition
        - db
        - config
      register: snapSub

    - name: "FAIL - Snapshot incomplete"
      fail:
        msg: "Missing in snapshot: {{ item.item }}"
      loop: "{{ snapSub.results }}"
      when: not item.stat.exists

    # ---------- Detect optional folders in the snapshot -------------------
    - name: "CHECK - Private folder in snapshot"
      stat: { path: "{{ snapshotDir }}/private" }
      register: privateInSnap

    - name: "CHECK - Public folder in snapshot"
      stat: { path: "{{ snapshotDir }}/public" }
      register: publicInSnap

    - name: "REPORT - Snapshot content"
      debug:
        msg:
          - "Snapshot:    {{ snapshotTagRaw }}"
          - "Has private: {{ privateInSnap.stat.exists }}"
          - "Has public:  {{ publicInSnap.stat.exists }}"

    - name: "READ - Snapshot metadata"
      slurp:
        src: "{{ snapshotDir }}/SNAPSHOT.info"
      register: snapInfo
      failed_when: false

    - name: "REPORT - Snapshot metadata"
      debug:
        msg: "{{ (snapInfo.content | default('') | b64decode).splitlines() }}"
      when: snapInfo.content is defined

    # ---------- Stop containers -------------------------------------------
    # Two paths:
    #   - siteDir exists  → docker compose down (normal case)
    #   - siteDir missing → docker stop by container name (self-contained
    #                       recovery after the site directory was lost)
    - name: "CHECK - Site directory exists"
      stat: { path: "{{ siteDir }}" }
      register: siteDirStat

    - name: "STOP - Bring site containers down (site directory present)"
      shell:
        cmd: docker compose down
        chdir: "{{ siteDir }}"
      register: stopResult
      changed_when: true
      when: siteDirStat.stat.exists

    - name: "STOP - Fallback: stop containers by name (site directory missing)"
      shell: |
        set -e
        for c in "{{ dbContainer }}" "{{ appContainer }}"; do
          if docker ps --format '{{ '{{' }}.Names{{ '}}' }}' | grep -qx "$c"; then
            docker stop "$c"
          fi
        done
      register: stopFallbackResult
      changed_when: stopFallbackResult.stdout | default('') | length > 0
      when: not siteDirStat.stat.exists

    # ---------- Recreate site directory + definition files ----------------
    - name: "RESTORE - Ensure site directory exists"
      file:
        path: "{{ siteDir }}"
        state: directory
        mode: "0744"
        owner: "{{ allVars.user.run }}"
        group: "{{ allVars.user.group }}"

    - name: "RESTORE - Site definition files"
      copy:
        src: "{{ snapshotDir }}/definition/{{ item }}"
        dest: "{{ siteDir }}/{{ item }}"
        remote_src: yes
        mode: "0600"
      loop:
        - docker-compose.yml
        - docker-compose.override.yml
        - .env

    # ---------- Ensure the volume symlink tree exists ---------------------
    # Normally created by dojo-create (site-folders.yml). Recreated here so
    # the rsync restore is self-contained even when the whole site directory
    # was lost. Without this, docker compose would fail to mount files like
    # volumes/config/db.custom.cnf.
    - name: "RESTORE - Ensure volumes/all/<site> directory exists"
      file:
        path: "{{ volumesAll }}"
        state: directory
        mode: "0744"
        owner: "{{ allVars.user.run }}"
        group: "{{ allVars.user.group }}"

    - name: "RESTORE - Ensure internal symlinks in volumes/all/<site>"
      file:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        state: link
        force: yes
      loop:
        - { src: "{{ allVars.path.files.config }}/{{ allVars.dojo.id }}",  dest: "{{ volumesAll }}/config" }
        - { src: "{{ allVars.path.volumes.db }}/{{ allVars.dojo.id }}",    dest: "{{ volumesAll }}/db" }
        - { src: "{{ allVars.path.volumes.logs }}/{{ allVars.dojo.id }}",  dest: "{{ volumesAll }}/logs" }
        - { src: "{{ allVars.path.files.private }}/{{ allVars.dojo.id }}", dest: "{{ volumesAll }}/private" }
        - { src: "{{ allVars.path.files.public }}/{{ allVars.dojo.id }}",  dest: "{{ volumesAll }}/public" }

    - name: "RESTORE - Ensure volumes symlink in site directory"
      file:
        src: "{{ volumesAll }}"
        dest: "{{ siteDir }}/volumes"
        state: link
        force: yes

    # ---------- Move current data aside -----------------------------------
    # Only the folders that WILL be overwritten are moved aside. Folders
    # that the snapshot does not contain (e.g. private/public in a -quick
    # snapshot) are left intact on the live site.
    - name: "SAFETY - Move current data aside (.{{ backupSuffix }})"
      shell: |
        set -e
        ts="{{ backupSuffix }}"
        targets="{{ dbTarget }} {{ configTarget }} {{ logsTarget }}"
        {% if privateInSnap.stat.exists %}
        targets="$targets {{ privateTarget }}"
        {% endif %}
        {% if publicInSnap.stat.exists %}
        targets="$targets {{ publicTarget }}"
        {% endif %}
        for p in $targets; do
          if [ -e "$p" ]; then mv "$p" "${p}.${ts}"; fi
          mkdir -p "$p"
        done
      changed_when: true

    # ---------- Restore data ----------------------------------------------
    - name: "RESTORE - Database"
      shell: "rsync -aHAX --delete '{{ snapshotDir }}/db/' '{{ dbTarget }}/'"
      changed_when: true

    - name: "RESTORE - Config"
      shell: "rsync -aHAX --delete '{{ snapshotDir }}/config/' '{{ configTarget }}/'"
      changed_when: true

    - name: "RESTORE - Logs"
      shell: "rsync -aHAX --delete '{{ snapshotDir }}/logs/' '{{ logsTarget }}/'"
      changed_when: true

    - name: "RESTORE - Private files"
      shell: "rsync -aHAX --delete '{{ snapshotDir }}/private/' '{{ privateTarget }}/'"
      changed_when: true
      when: privateInSnap.stat.exists

    - name: "RESTORE - Public files"
      shell: "rsync -aHAX --delete '{{ snapshotDir }}/public/' '{{ publicTarget }}/'"
      changed_when: true
      when: publicInSnap.stat.exists

    # ---------- Fix ownership / permissions -------------------------------
    - name: "FIX - DB ownership / mode"
      file:
        path: "{{ dbTarget }}"
        state: directory
        recurse: yes
        owner: "{{ allVars.volumes.db.owner | default(allVars.user.run) }}"
        group: "{{ allVars.volumes.db.group | default(allVars.user.group) }}"
        mode: "{{ allVars.volumes.db.mode | default('0744') }}"

    - name: "FIX - Config ownership / mode"
      file:
        path: "{{ configTarget }}"
        state: directory
        recurse: yes
        owner: "{{ allVars.volumes.app.owner | default(allVars.user.run) }}"
        group: "{{ allVars.volumes.app.group | default(allVars.user.group) }}"
        mode: "{{ allVars.volumes.app.mode | default('0744') }}"

    - name: "FIX - Private ownership / mode"
      file:
        path: "{{ privateTarget }}"
        state: directory
        recurse: yes
        owner: "{{ allVars.volumes.app.owner | default(allVars.user.run) }}"
        group: "{{ allVars.volumes.app.group | default(allVars.user.group) }}"
        mode: "{{ allVars.volumes.app.mode | default('0744') }}"
      when: privateInSnap.stat.exists

    - name: "FIX - Public ownership / mode"
      file:
        path: "{{ publicTarget }}"
        state: directory
        recurse: yes
        owner: "{{ allVars.volumes.app.owner | default(allVars.user.run) }}"
        group: "{{ allVars.volumes.app.group | default(allVars.user.group) }}"
        mode: "{{ allVars.volumes.app.mode | default('0744') }}"
      when: publicInSnap.stat.exists

    - name: "FIX - Logs ownership / mode"
      file:
        path: "{{ logsTarget }}"
        state: directory
        recurse: yes
        owner: "{{ allVars.volumes.app.owner | default(allVars.user.run) }}"
        group: "{{ allVars.volumes.app.group | default(allVars.user.group) }}"

    # ---------- Start -----------------------------------------------------
    - name: "START - Bring site containers up"
      shell:
        cmd: docker compose up -d
        chdir: "{{ siteDir }}"
      register: startResult

    - name: "REPORT - Restore finished"
      debug:
        msg:
          - "Site:      {{ allVars.dojo.id }}"
          - "Snapshot:  {{ snapshotTagRaw }}"
          - "Source:    {{ snapshotDir }}"
          - "Data:      db, config, logs{% if privateInSnap.stat.exists %}, private{% endif %}{% if publicInSnap.stat.exists %}, public{% endif %}"
          - "Preserved: {% if not privateInSnap.stat.exists %}private {% endif %}{% if not publicInSnap.stat.exists %}public{% endif %} (left untouched)"
          - "Definition: restored from snapshot (docker-compose*.yml, .env)"
          - "Rollback:  stop the containers and rename .{{ backupSuffix }} back."
          - "Cleanup:   rm -rf {{ dbTarget }}.{{ backupSuffix }} (and siblings) once verified."
