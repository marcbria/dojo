---
# ============================================================================
# RESTORE - Restore a site from a ZFS snapshot set.
#
# DESTRUCTIVE: current data is moved to <dataset>/_pre-restore/<site>-<ts>/
# before restoring. Verify, then delete the _pre-restore tree manually.
#
# The pre-restore backups live in a dedicated subfolder of each dataset so
# the top level stays clean:
#
#   /srv/volumes/db/anuarioiet/                       ← live data
#   /srv/volumes/db/_pre-restore/anuarioiet-<ts>/     ← previous data
#
# Restore never uses `zfs rollback` (that would revert other sites).
# It rsyncs from the read-only snapshot mount:
#   <dataset>/.zfs/snapshot/<snap>/<relative-path>/<site>/
#
# IMPORTANT: this playbook restores DATA only. The site definition files
# (docker-compose.yml, docker-compose.override.yml, .env) live in
# /home/docker/sites/<site>/ and are NOT part of any ZFS snapshot — they are
# regenerable from inventory + vault (GitOps principle). If they are missing,
# this playbook fails before touching anything and tells you to run
# `just dojo-create <site> <host>` first.
#
# Full recovery procedure when the site directory is gone:
#   just dojo-create <site> <host>
#   just dojo-restore-snap <site> <host> <tag> confirm=RESTORE-<site>
#
# Usage:
#   just dojo-restore-snap <site> <host> <tag> confirm=RESTORE-<site>
#
# The <tag> may be either the bare tag ("20241005-143022") or the full
# snapshot name ("backup-20241005-143022"); both are accepted.
# ============================================================================
- name: "RESTORE - Restore a site from a ZFS snapshot"
  hosts: all
  become: yes
  gather_facts: yes
  vars:
    hostName: "{{ host }}"
    siteParam: "{{ site }}"
    snapshotPrefix: "{{ snapshot_prefix | default('backup') }}"
    snapshotTagRaw: "{{ snapshot_tag | default('') }}"
    snapshotName: >-
      {{ snapshotTagRaw
         if snapshotTagRaw.startswith(snapshotPrefix ~ '-')
         else (snapshotPrefix ~ '-' ~ snapshotTagRaw) }}
    backupSuffix: "{{ now(utc=true, fmt='%Y%m%d-%H%M%S') }}"
    confirmToken: "{{ confirm | default('') }}"
  vars_files:
    - ./configs/dojo.yml
    - ./configs/secret.yml
    - ./inventory/sites/base-{{ hostName }}.yml
  tasks:
    - name: "INIT - Load allVars"
      include_tasks: ../setAllVars.yml
      vars: { mode: site, param: "{{ siteParam }}" }

    - name: "INIT - Resolve datasets, targets and _pre-restore paths"
      set_fact:
        zfsDb:      "{{ zfs_dataset_db    | default(allVars.path.volumes.db    | regex_replace('^/', '')) }}"
        zfsFiles:   "{{ zfs_dataset_files | default(allVars.path.volumes.files | regex_replace('^/', '')) }}"
        zfsLogs:    "{{ zfs_dataset_logs  | default(allVars.path.volumes.logs  | regex_replace('^/', '')) }}"
        siteDir:       "{{ allVars.path.base.sites }}/{{ allVars.dojo.id }}"
        dbTarget:      "{{ allVars.path.volumes.db }}/{{ allVars.dojo.id }}"
        configTarget:  "{{ allVars.path.files.config }}/{{ allVars.dojo.id }}"
        privateTarget: "{{ allVars.path.files.private }}/{{ allVars.dojo.id }}"
        publicTarget:  "{{ allVars.path.files.public }}/{{ allVars.dojo.id }}"
        logsTarget:    "{{ allVars.path.volumes.logs }}/{{ allVars.dojo.id }}"
        dbPreRestore:      "{{ allVars.path.volumes.db }}/_pre-restore/{{ allVars.dojo.id }}-{{ backupSuffix }}"
        configPreRestore:  "{{ allVars.path.files.config }}/_pre-restore/{{ allVars.dojo.id }}-{{ backupSuffix }}"
        privatePreRestore: "{{ allVars.path.files.private }}/_pre-restore/{{ allVars.dojo.id }}-{{ backupSuffix }}"
        publicPreRestore:  "{{ allVars.path.files.public }}/_pre-restore/{{ allVars.dojo.id }}-{{ backupSuffix }}"
        logsPreRestore:    "{{ allVars.path.volumes.logs }}/_pre-restore/{{ allVars.dojo.id }}-{{ backupSuffix }}"

    - name: "SAFETY - Require explicit confirmation"
      fail:
        msg: |
          Restore is DESTRUCTIVE.
          Pass:  confirm=RESTORE-{{ allVars.dojo.id }}
          Run:   just dojo-restore-snap {{ site }} {{ host }} {{ snapshotTagRaw }} confirm=RESTORE-{{ allVars.dojo.id }}
      when: confirmToken != ('RESTORE-' ~ allVars.dojo.id)

    - name: "CHECK - snapshot_tag provided"
      fail: { msg: "snapshot_tag is required" }
      when: snapshotTagRaw | length == 0

    - name: "CHECK - Site directory exists"
      stat: { path: "{{ siteDir }}" }
      register: siteDirStat

    - name: "FAIL - Site not found"
      fail: { msg: "Site not found: {{ siteDir }}" }
      when: not siteDirStat.stat.exists

    - name: "CHECK - Site definition files exist (docker-compose*.yml, .env)"
      stat:
        path: "{{ siteDir }}/{{ item }}"
      loop:
        - docker-compose.yml
        - docker-compose.override.yml
        - .env
      register: siteDefFiles

    - name: "FAIL - Missing site definition files"
      fail:
        msg: |
          Missing site definition file(s) in {{ siteDir }}/:
          {% for r in siteDefFiles.results if not r.stat.exists %}
            - {{ r.item }}
          {% endfor %}

          These files are NOT covered by ZFS snapshots. They are regenerated
          from inventory + vault (dojo GitOps principle).

          Full recovery procedure:
            1) just dojo-create {{ site }} {{ host }}
            2) just dojo-restore-snap {{ site }} {{ host }} {{ snapshotTagRaw }} confirm=RESTORE-{{ allVars.dojo.id }}

          Note: dojo-create also rewrites /srv/volumes/files/config/{{ allVars.dojo.id }}/*
          (config.inc.php, db.custom.cnf, php.custom.ini, apache.conf). Those will
          be re-restored from the snapshot by this playbook right after.
      when: siteDefFiles.results | selectattr('stat.exists', 'equalto', false) | list | length > 0

    - name: "CHECK - Snapshot exists on every dataset"
      command: "zfs list -H -t snapshot -o name {{ item }}@{{ snapshotName }}"
      loop: ["{{ zfsDb }}", "{{ zfsFiles }}", "{{ zfsLogs }}"]
      register: snapCheck
      changed_when: false
      failed_when: false

    - name: "FAIL - Missing snapshot"
      fail:
        msg: "Snapshot {{ snapshotName }} missing on {{ item.item }}"
      loop: "{{ snapCheck.results }}"
      when: item.rc != 0

    - name: "CHECK - Site data present inside the snapshot"
      stat:
        path: "{{ item }}"
      loop:
        - "{{ allVars.path.volumes.db }}/.zfs/snapshot/{{ snapshotName }}/{{ allVars.dojo.id }}"
        - "{{ allVars.path.volumes.files }}/.zfs/snapshot/{{ snapshotName }}/config/{{ allVars.dojo.id }}"
        - "{{ allVars.path.volumes.files }}/.zfs/snapshot/{{ snapshotName }}/private/{{ allVars.dojo.id }}"
        - "{{ allVars.path.volumes.files }}/.zfs/snapshot/{{ snapshotName }}/public/{{ allVars.dojo.id }}"
      register: snapAccess

    - name: "FAIL - Snapshot does not contain this site"
      fail:
        msg: "Missing in snapshot: {{ item.item }}"
      loop: "{{ snapAccess.results }}"
      when: not item.stat.exists

    # ---------- Stop containers -------------------------------------------
    - name: "STOP - Bring site containers down"
      shell:
        cmd: docker compose down
        chdir: "{{ siteDir }}"
      register: stopResult
      changed_when: true

    # ---------- Ensure _pre-restore directories exist ---------------------
    - name: "RESTORE - Ensure _pre-restore directories exist"
      file:
        path: "{{ item }}"
        state: directory
        mode: "0744"
        owner: "{{ allVars.user.run }}"
        group: "{{ allVars.user.group }}"
      loop:
        - "{{ allVars.path.volumes.db }}/_pre-restore"
        - "{{ allVars.path.files.config }}/_pre-restore"
        - "{{ allVars.path.files.private }}/_pre-restore"
        - "{{ allVars.path.files.public }}/_pre-restore"
        - "{{ allVars.path.volumes.logs }}/_pre-restore"

    # ---------- Move current data aside -----------------------------------
    # Uses a portable /bin/sh construct (dash-compatible):
    #   - No bash-only features (declare -A, arrays).
    #   - No Jinja {% %} block tags inside the literal block: a line
    #     starting with {% at inconsistent indentation is not valid YAML
    #     and fails the parser before templating even runs.
    #   - The pairs list is static: ZFS snapshot sets always contain all
    #     five folders (db, config, private, public, logs).
    - name: "SAFETY - Move current data aside ({{ backupSuffix }})"
      shell: |
        set -e
        pairs="
          {{ dbTarget }}|{{ dbPreRestore }}
          {{ configTarget }}|{{ configPreRestore }}
          {{ privateTarget }}|{{ privatePreRestore }}
          {{ publicTarget }}|{{ publicPreRestore }}
          {{ logsTarget }}|{{ logsPreRestore }}
        "
        echo "$pairs" | while IFS='|' read -r src dst; do
          [ -z "$src" ] && continue
          if [ -e "$src" ]; then mv "$src" "$dst"; fi
          mkdir -p "$src"
        done
      changed_when: true

    # ---------- Restore standard per-site paths ---------------------------
    - name: "RESTORE - Standard per-site paths"
      shell: |
        set -e
        rsync -aHAX --delete "{{ item.src }}/" "{{ item.dst }}/"
      loop:
        - { src: "{{ allVars.path.volumes.db }}/.zfs/snapshot/{{ snapshotName }}/{{ allVars.dojo.id }}",
            dst: "{{ dbTarget }}" }
        - { src: "{{ allVars.path.volumes.files }}/.zfs/snapshot/{{ snapshotName }}/config/{{ allVars.dojo.id }}",
            dst: "{{ configTarget }}" }
        - { src: "{{ allVars.path.volumes.files }}/.zfs/snapshot/{{ snapshotName }}/private/{{ allVars.dojo.id }}",
            dst: "{{ privateTarget }}" }
        - { src: "{{ allVars.path.volumes.files }}/.zfs/snapshot/{{ snapshotName }}/public/{{ allVars.dojo.id }}",
            dst: "{{ publicTarget }}" }
        - { src: "{{ allVars.path.volumes.logs }}/.zfs/snapshot/{{ snapshotName }}/{{ allVars.dojo.id }}",
            dst: "{{ logsTarget }}" }
      changed_when: true
      loop_control:
        label: "{{ item.dst }}"

    # ---------- Fix ownership / permissions -------------------------------
    - name: "FIX - DB ownership / mode"
      file:
        path: "{{ dbTarget }}"
        state: directory
        recurse: yes
        owner: "{{ allVars.volumes.db.owner | default(allVars.user.run) }}"
        group: "{{ allVars.volumes.db.group | default(allVars.user.group) }}"
        mode: "{{ allVars.volumes.db.mode | default('0744') }}"

    - name: "FIX - App files ownership / mode"
      file:
        path: "{{ item }}"
        state: directory
        recurse: yes
        owner: "{{ allVars.volumes.app.owner | default(allVars.user.run) }}"
        group: "{{ allVars.volumes.app.group | default(allVars.user.group) }}"
        mode: "{{ allVars.volumes.app.mode | default('0744') }}"
      loop:
        - "{{ configTarget }}"
        - "{{ publicTarget }}"
        - "{{ privateTarget }}"

    - name: "FIX - Logs ownership / mode"
      file:
        path: "{{ logsTarget }}"
        state: directory
        recurse: yes
        owner: "{{ allVars.volumes.app.owner | default(allVars.user.run) }}"
        group: "{{ allVars.volumes.app.group | default(allVars.user.group) }}"

    # ---------- Start -----------------------------------------------------
    - name: "START - Bring site containers up"
      shell:
        cmd: docker compose up -d
        chdir: "{{ siteDir }}"
      register: startResult

    - name: "REPORT - Restore finished"
      debug:
        msg:
          - "Site:      {{ allVars.dojo.id }}"
          - "Snapshot:  {{ snapshotName }}"
          - "Data:      db, files/{config,private,public}, logs"
          - "Note:      docker-compose*.yml and .env are NOT part of the snapshot"
          - "Rollback:  move /srv/volumes/<dataset>/_pre-restore/{{ allVars.dojo.id }}-{{ backupSuffix }} back to its original path"
          - "Cleanup:   rm -rf /srv/volumes/db/_pre-restore/{{ allVars.dojo.id }}-{{ backupSuffix }} (and siblings under *_pre-restore/) once verified."
