---
- name: Create an APACHE virtual host file from the site's dictionary vars.
  hosts: all
  become: yes
  gather_facts: yes
  vars:
    hostName: "{{ host }}"
    siteParam: "{{ site }}"
    fileCreation: "{{ ansible_date_time.iso8601 }}"
  vars_files:
    - ./configs/dojo.yml
    - ./configs/secret.yml
    - ./inventory/sites/base-{{ hostName }}.yml
  tasks:
    # sets "allVars" array from the site's dictionaries as follows:
    #           baseHost > siteGeneric > siteHost > dojoVars.
    - include_tasks: ../setAllVars.yml
      vars:
        mode: site
        param: "{{ siteParam }}"
    
    - name: Generate apache-config file from unified template
      template:
        src: "./templates/{{ allVars.dojo.tool }}/apache.{{ allVars.dojo.tool }}.conf.j2"
        dest: "{{ allVars.path.files.config }}/{{ allVars.dojo.id }}/apache.conf"
